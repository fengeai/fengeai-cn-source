<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片编辑工具 - 枫哥AI进化社</title>
  <style>
    :root {
      --blue: #1267ff;
      --ink: #061a3a;
      --muted: #5c6f8f;
      --line: #d8e6ff;
      --soft: #f4f8ff;
      --panel: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f7fbff 0%, #ffffff 42%);
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid #e7eefc;
    }

    .nav {
      max-width: 1280px;
      margin: 0 auto;
      height: 72px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      color: var(--ink);
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1267ff, #00b7ff);
      color: #fff;
      font-weight: 900;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      color: #14284a;
      font-weight: 700;
    }

    .nav-links a:hover { color: var(--blue); }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 34px 24px 46px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .editor-shell {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(18, 103, 255, 0.08);
    }

    .controls {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .control-block {
      border: 1px solid #edf3ff;
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }

    .block-title {
      margin: 0 0 12px;
      font-weight: 900;
      color: var(--ink);
    }

    .upload-btn, .primary-btn, .plain-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .upload-btn, .primary-btn {
      color: #fff;
      background: var(--blue);
      box-shadow: 0 14px 30px rgba(18, 103, 255, 0.22);
    }

    .plain-btn {
      color: #18345c;
      background: #eef5ff;
    }

    .upload-btn:hover, .primary-btn:hover, .plain-btn:hover {
      transform: translateY(-1px);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .preset {
      border: 1px solid #d9e7ff;
      background: #fff;
      color: #234269;
      border-radius: 8px;
      padding: 10px 8px;
      font-weight: 800;
      cursor: pointer;
    }

    .preset.active {
      color: var(--blue);
      border-color: var(--blue);
      background: #eef5ff;
    }

    label {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .range-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid #d9e7ff;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(18, 103, 255, 0.12);
    }

    .swatches {
      display: flex;
      gap: 9px;
      margin-top: 12px;
    }

    .swatch {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 3px solid #fff;
      box-shadow: 0 0 0 1px #cbd8ef;
      cursor: pointer;
    }

    .swatch.active {
      box-shadow: 0 0 0 2px var(--blue);
    }

    .stage {
      padding: 18px;
      min-height: 650px;
    }

    .stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .canvas-wrap {
      min-height: 570px;
      display: grid;
      place-items: center;
      border: 1px solid #e3edff;
      border-radius: 8px;
      padding: 16px;
      background-color: #f8fbff;
      background-image:
        linear-gradient(45deg, #e6eefc 25%, transparent 25%),
        linear-gradient(-45deg, #e6eefc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e6eefc 75%),
        linear-gradient(-45deg, transparent 75%, #e6eefc 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    canvas {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(6, 26, 58, 0.18);
    }

    .rotate-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .rotate-row button {
      border: 1px solid #d9e7ff;
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      color: #234269;
      font-weight: 900;
      cursor: pointer;
    }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .nav-links { display: none; }
      .hero { align-items: flex-start; flex-direction: column; }
      .editor-shell { grid-template-columns: 1fr; }
      .stage { min-height: auto; }
      .canvas-wrap { min-height: 360px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a class="brand" href="/">
        <span class="brand-mark">枫</span>
        <span>枫哥AI进化社</span>
      </a>
      <div class="nav-links">
        <a href="/">首页</a>
        <a href="/#tools">AI工具</a>
        <a href="/wechat/">公众号排版</a>
        <a href="/assistant/">个人AI创作助手</a>
      </div>
    </nav>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <h1>图片编辑工具</h1>
        <p>像美图秀秀一样简单：上传图片，选尺寸，调色，加标题，直接导出。</p>
      </div>
      <button class="primary-btn" style="max-width: 180px;" id="downloadTop">导出图片</button>
    </section>

    <section class="editor-shell">
      <aside class="panel controls">
        <input id="fileInput" type="file" accept="image/*" hidden>

        <div class="control-block">
          <p class="block-title">第一步：上传图片</p>
          <button class="upload-btn" id="uploadBtn">上传图片</button>
          <p class="hint">图片只在浏览器本地处理，不调用 AI 模型。</p>
        </div>

        <div class="control-block">
          <p class="block-title">常用尺寸</p>
          <div class="preset-grid" id="presetGrid"></div>
        </div>

        <div class="control-block">
          <p class="block-title">快速美化</p>
          <div id="rangeControls"></div>
          <div class="rotate-row">
            <button id="rotateLeft">左转</button>
            <button id="rotateRight">右转</button>
            <button id="resetBtn">重置</button>
          </div>
        </div>

        <div class="control-block">
          <p class="block-title">添加标题</p>
          <input id="captionInput" type="text" value="枫哥AI进化社" placeholder="输入图片标题">
          <div id="fontControl"></div>
          <div class="swatches" id="swatches"></div>
        </div>

        <button class="primary-btn" id="downloadBtn">导出图片</button>
        <a class="plain-btn" href="/" style="display:block;text-align:center;">返回首页</a>
      </aside>

      <section class="panel stage">
        <div class="stage-head">
          <span id="presetLabel">公众号首图</span>
          <span id="presetSize">900 x 383</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="canvas"></canvas>
        </div>
      </section>
    </section>
  </main>

  <script>
    const presets = [
      { name: 'wechat', label: '公众号首图', width: 900, height: 383 },
      { name: 'square', label: '方图', width: 1080, height: 1080 },
      { name: 'poster', label: '竖版海报', width: 1080, height: 1440 },
      { name: 'video', label: '视频封面', width: 1280, height: 720 }
    ];

    const colors = ['#ffffff', '#111827', '#f97316', '#1267ff'];
    const state = {
      image: null,
      fileName: 'fengge-image',
      preset: presets[0],
      brightness: 100,
      contrast: 100,
      saturation: 100,
      zoom: 100,
      rotation: 0,
      caption: '枫哥AI进化社',
      captionSize: 54,
      captionColor: colors[0]
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');

    function draw() {
      canvas.width = state.preset.width;
      canvas.height = state.preset.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      document.getElementById('presetLabel').textContent = state.preset.label;
      document.getElementById('presetSize').textContent = `${state.preset.width} x ${state.preset.height}`;

      if (!state.image) {
        ctx.fillStyle = '#f8fbff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#7891b6';
        ctx.font = '700 34px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('上传一张图片开始编辑', canvas.width / 2, canvas.height / 2);
        return;
      }

      ctx.save();
      ctx.filter = `brightness(${state.brightness}%) contrast(${state.contrast}%) saturate(${state.saturation}%)`;
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((state.rotation * Math.PI) / 180);

      const rotated = Math.abs(state.rotation % 180) === 90;
      const areaWidth = rotated ? canvas.height : canvas.width;
      const areaHeight = rotated ? canvas.width : canvas.height;
      const coverScale = Math.max(areaWidth / state.image.width, areaHeight / state.image.height);
      const scale = coverScale * (state.zoom / 100);
      const drawWidth = state.image.width * scale;
      const drawHeight = state.image.height * scale;
      ctx.drawImage(state.image, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
      ctx.restore();

      if (state.caption.trim()) {
        const padding = Math.max(28, state.preset.width * 0.04);
        ctx.save();
        ctx.font = `800 ${state.captionSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.shadowColor = 'rgba(6, 26, 58, 0.55)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 4;
        ctx.fillStyle = state.captionColor;
        ctx.fillText(state.caption.trim(), state.preset.width / 2, state.preset.height - padding);
        ctx.restore();
      }
    }

    function renderPresets() {
      const grid = document.getElementById('presetGrid');
      grid.innerHTML = '';
      presets.forEach((preset) => {
        const button = document.createElement('button');
        button.className = `preset ${state.preset.name === preset.name ? 'active' : ''}`;
        button.textContent = preset.label;
        button.onclick = () => {
          state.preset = preset;
          renderPresets();
          draw();
        };
        grid.appendChild(button);
      });
    }

    function rangeControl(container, key, label, min, max, suffix = '') {
      const wrapper = document.createElement('label');
      wrapper.innerHTML = `
        <span class="range-head">
          <span>${label}</span>
          <strong>${state[key]}${suffix}</strong>
        </span>
        <input type="range" min="${min}" max="${max}" value="${state[key]}">
      `;
      const input = wrapper.querySelector('input');
      const value = wrapper.querySelector('strong');
      input.oninput = () => {
        state[key] = Number(input.value);
        value.textContent = `${state[key]}${suffix}`;
        draw();
      };
      container.appendChild(wrapper);
    }

    function renderControls() {
      const ranges = document.getElementById('rangeControls');
      ranges.innerHTML = '';
      rangeControl(ranges, 'brightness', '亮度', 60, 140, '%');
      rangeControl(ranges, 'contrast', '对比度', 60, 150, '%');
      rangeControl(ranges, 'saturation', '饱和度', 40, 180, '%');
      rangeControl(ranges, 'zoom', '缩放', 100, 180, '%');

      const fontControl = document.getElementById('fontControl');
      fontControl.innerHTML = '';
      rangeControl(fontControl, 'captionSize', '字号', 28, 92);

      const swatches = document.getElementById('swatches');
      swatches.innerHTML = '';
      colors.forEach((color) => {
        const button = document.createElement('button');
        button.className = `swatch ${state.captionColor === color ? 'active' : ''}`;
        button.style.background = color;
        button.onclick = () => {
          state.captionColor = color;
          renderControls();
          draw();
        };
        swatches.appendChild(button);
      });
    }

    function reset() {
      state.brightness = 100;
      state.contrast = 100;
      state.saturation = 100;
      state.zoom = 100;
      state.rotation = 0;
      state.caption = '枫哥AI进化社';
      state.captionSize = 54;
      state.captionColor = colors[0];
      document.getElementById('captionInput').value = state.caption;
      renderControls();
      draw();
    }

    function download() {
      const link = document.createElement('a');
      link.download = `${state.fileName}-${state.preset.name}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    document.getElementById('downloadBtn').onclick = download;
    document.getElementById('downloadTop').onclick = download;
    document.getElementById('rotateLeft').onclick = () => { state.rotation -= 90; draw(); };
    document.getElementById('rotateRight').onclick = () => { state.rotation += 90; draw(); };
    document.getElementById('resetBtn').onclick = reset;
    document.getElementById('captionInput').oninput = (event) => {
      state.caption = event.target.value;
      draw();
    };

    fileInput.onchange = (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        state.image = image;
        state.fileName = file.name.replace(/\.[^.]+$/, '') || 'fengge-image';
        URL.revokeObjectURL(url);
        draw();
      };
      image.src = url;
    };

    renderPresets();
    renderControls();
    draw();
  </script>
</body>
</html>
