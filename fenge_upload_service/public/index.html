<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>枫哥AI进化社 - 给自媒体人的 AI 内容生产工作台</title>
  <meta name="description" content="枫哥AI进化社，为自媒体人打造 AI 内容生产工作台，从找选题、写初稿、公众号排版，到封面提示词和发布检查。">
  <link rel="stylesheet" href="/home.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="枫哥AI进化社">
      <img src="/fenge-ai-evolution-logo.png" alt="枫哥AI进化社">
    </a>
    <nav class="nav-links" aria-label="主导航">
      <a href="/">首页</a>
      <a href="/assistant/">内容工厂</a>
      <a href="/wechat/">公众号排版</a>
      <a href="/toolbox/">AI工具精选</a>
      <a href="/upload">学员作品</a>
      <a href="#about">关于枫哥</a>
    </nav>
    <a class="header-cta" href="/assistant/">开始创作</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">枫哥AI进化社</p>
        <h1>给自媒体人的 AI 内容生产工作台</h1>
        <p class="hero-subtitle">从找选题、写初稿、公众号排版，到封面提示词和发布检查，一站跑通，把 AI 从聊天工具变成内容助手。</p>
        <div class="hero-actions">
          <a class="btn primary" href="/assistant/">开始生成文章</a>
          <a class="btn secondary" href="/wechat/">试试公众号排版</a>
        </div>
        <div class="audience-tags" aria-label="适合人群">
          <span>公众号作者</span>
          <span>小红书博主</span>
          <span>AI 新手</span>
          <span>自媒体副业人</span>
        </div>
      </div>

      <div class="workbench-card" aria-label="内容生产工作台预览">
        <div class="window-dots"><span></span><span></span><span></span></div>
        <div class="task-card">
          <div class="logo-chip">枫</div>
          <div>
            <strong>今日任务</strong>
            <p>10 分钟完成一篇公众号初稿</p>
          </div>
        </div>
        <div class="task-grid">
          <div><i>?</i><strong>找选题</strong></div>
          <div><i>✍</i><strong>写初稿</strong></div>
          <div><i>▣</i><strong>排版</strong></div>
          <div><i>□</i><strong>封面</strong></div>
        </div>
        <div class="result-card">
          <strong>输出结果</strong>
          <p>标题、大纲、正文、金句、封面提示词、发布检查清单</p>
        </div>
      </div>
    </section>

    <section id="about" class="about">
      <h2>把内容创作变成一条稳定流水线</h2>
      <p>先跑通最小闭环，再逐步升级工具和流程。内容工厂负责把重复动作交给 AI，人负责判断、经验和表达。</p>
    </section>
  </main>

  <script src="/analytics.js"></script>
</body>
</html>
