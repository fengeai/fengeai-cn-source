<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>枫哥公众号一键排版助手</title>
  <meta name="description" content="把文章粘贴进来，一键生成适合公众号后台的清爽排版稿。">
  <link rel="stylesheet" href="/wechat/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand-link" href="/">枫哥AI进化社</a>
    <div class="actions">
      <button id="sampleBtn">示例</button>
      <button id="clearBtn">清空</button>
      <button id="formatBtn" class="primary">一键排版</button>
      <button id="copyBtn">复制到公众号</button>
    </div>
  </header>

  <main class="layout">
    <section class="pane editor-pane">
      <div class="pane-title">
        <div>
          <h1>公众号一键排版</h1>
          <p>粘贴正文，生成清爽、可复制的公众号排版稿。</p>
        </div>
        <span id="status" class="status-line"></span>
      </div>
      <textarea id="markdownInput" spellcheck="false" placeholder="# 标题&#10;&#10;把 Markdown 文章粘贴到这里"></textarea>
    </section>

    <section class="pane preview-pane">
      <div class="pane-title">
        <h2>公众号预览</h2>
      </div>
      <div class="phone-shell">
        <article id="preview" class="preview empty">排版结果会显示在这里。</article>
      </div>
    </section>
  </main>

  <script src="/wechat/app.js"></script>
  <script src="/analytics.js"></script>
</body>
</html>
