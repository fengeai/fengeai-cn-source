server {
    listen 80;
    server_name fengeai.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fengeai.cn;

    ssl_certificate /etc/nginx/certs/fengeai.cn.pem;
    ssl_certificate_key /etc/nginx/certs/fengeai.cn.key;

    location /api/ {
        proxy_pass http://uploader:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
    }

    location /works/ {
        alias /usr/share/nginx/html/works/;
        index index.html;
        autoindex off;
    }

    location /upload {
        proxy_pass http://uploader:3000/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /wechat/api/ {
        proxy_pass http://wechat:3010/wechat/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2M;
    }

    location /wechat/ {
        proxy_pass http://wechat:3010/wechat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /wechat {
        return 301 /wechat/;
    }

    location /assistant/api/ {
        proxy_pass http://content-factory-api:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assistant/ {
        proxy_pass http://content-factory-web:3002/assistant/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /assistant {
        proxy_pass http://content-factory-web:3002/assistant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://uploader:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
