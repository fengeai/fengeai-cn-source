version: "3"

services:
  uploader:
    build: .
    container_name: fenge_uploader
    restart: always
    environment:
      - PORT=3000
      - ACCESS_TOKEN=${ACCESS_TOKEN:?set ACCESS_TOKEN}
    volumes:
      - ./data:/app/data
    networks:
      - fenge_net

  nginx:
    image: nginx:alpine
    container_name: fenge_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
      - ./data/student_works:/usr/share/nginx/html/works
    depends_on:
      - uploader
    networks:
      - fenge_net

networks:
  fenge_net:
    driver: bridge
